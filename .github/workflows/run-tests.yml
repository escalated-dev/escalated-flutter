name: Tests & Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # The job was named "Tests & Analyze" but only ever analyzed. Analysis
      # catches API breakage -- it is what caught file_picker removing
      # FilePicker.platform -- but it cannot catch a behaviour regression.
      - run: flutter test
