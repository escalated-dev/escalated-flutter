version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # flutter_html 3.0.0 calls Element.matches, which html 0.15.7 removed;
      # with 0.15.7 nothing importing ReplyThread compiles.
      - dependency-name: "html"
        versions: ["0.15.7"]

  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # flutter_html 3.0.0 calls Element.matches, which html 0.15.7 removed;
      # with 0.15.7 nothing importing ReplyThread compiles.
      - dependency-name: "html"
        versions: ["0.15.7"]
